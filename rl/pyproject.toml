[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labyrinthe-rl"
version = "0.1.0"
description = "Self-play training stack for Labyrinthe: JAX engine, lattice encoding, baselines, evaluation"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["jax[cpu]>=0.4.30", "numpy>=1.26", "gymnasium>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["labyrinthe_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
